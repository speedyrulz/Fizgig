# Pods deployed before 17 Oct 2026 run FIZGIG_REF=v8 (a branch): keep it level with master on every push, so they
# update at boot like the template's own pods (FIZGIG_REF=master) do.
name: Keep v8 in step with master

on:
  push:
    branches: [master]

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fast-forward v8 to master
        run: git push origin HEAD:refs/heads/v8
