name: Checks

on:
  pull_request:
  push:
    branches: [master]

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r checks/requirements.txt
      - name: Python files compile
        run: python -m compileall -q src
      - name: Web UI scripts parse
        run: for f in src/fizgig/web/static/*.js; do node --check "$f"; done
      - name: Checks
        run: python -m pytest checks -q
