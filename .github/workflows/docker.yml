# Builds the Fizgig pod image and pushes it to GHCR.
#
# GHCR rather than Docker Hub: it's free and unlimited for public images, needs no extra account
# or secret (GITHUB_TOKEN is enough), and has no anonymous pull rate limit — which matters,
# because a cold-starting pod is an anonymous pull.
#
# Runs on release tags and on demand. Deliberately NOT on every push to master: the image holds
# only system packages and pip dependencies, and Fizgig's source is pulled at boot — so a code
# change needs no rebuild. Only requirements.txt changes do.
name: Build pod image

on:
  push:
    tags: ["v*"]
    paths-ignore: ["**.md"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Extra tag to publish (e.g. test)"
        required: false
      vast_only:
        description: "Build only the Vast.ai image (on the published latest)"
        type: boolean
        required: false
        default: false

env:
  REGISTRY: ghcr.io
  IMAGE: ${{ github.repository }}

jobs:
  build:
    if: ${{ !inputs.vast_only }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      # The torch cu128 wheel alone is several GB and the runner ships with ~14 GB free.
      # Clearing the preinstalled toolchains buys back ~20 GB and is the difference between
      # this building and dying on "no space left on device" halfway through pip.
      - name: Free up runner disk
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/share/boost "$AGENT_TOOLSDIRECTORY"
          df -h /

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=raw,value=${{ inputs.tag }},enable=${{ inputs.tag != '' }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          push: true
          # Baked in so the running container can report which image it is, which a mutable tag
          # otherwise makes impossible to determine from the outside.
          build-args: |
            FIZGIG_IMAGE_VERSION=${{ steps.meta.outputs.version }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # The Vast.ai image: this image plus cloudflared (HTTPS addresses) and docker/entrypoint_vast.sh. A small layer on
  # top, so it can't drift from the RunPod image. On a release it builds on the image just pushed; by hand, with a
  # test tag, on the published latest (only the Vast image is pushed then, under that tag).
  vast:
    needs: build
    if: ${{ always() && (needs.build.result == 'success' || needs.build.result == 'skipped') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: base
        run: |
          repo="${GITHUB_REPOSITORY,,}"
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then tag="${GITHUB_REF#refs/tags/v}"; else tag=latest; fi
          echo "image=${{ env.REGISTRY }}/${repo}:${tag}" >> "$GITHUB_OUTPUT"
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE }}-vast
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=raw,value=${{ inputs.tag }},enable=${{ inputs.tag != '' }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.vast
          push: true
          build-args: |
            BASE=${{ steps.base.outputs.image }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
